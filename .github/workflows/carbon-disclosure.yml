name: Carbon disclosure checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disclosure:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check data processing, disclosure and Node server
        working-directory: carbon_disclosure
        run: node --test
      - name: Check Python server and portable HTML
        run: python -m unittest discover -s carbon_disclosure/tests -p "test_*.py" -v
      - name: Install Streamlit integration dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Check integrated disclosure tab
        run: python -m pytest -q tests/test_carbon_disclosure_integration.py tests/test_unified_launcher.py
