name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖（requirements + pytest）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      # CI 环境没有 data/raw（原始数据永不入库）→ pipeline 自动走演示样本，
      # 闸门对真实数据的五项标 SKIP、因子两项 PASS，退出码 0。
      # 放下附件后同一命令即切真实模式，验收标准不变。
      - name: 引擎闸门 + 前端 AppTest + 弃用 API 防线
        run: pytest -q tests/
